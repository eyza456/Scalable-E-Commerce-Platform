worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    log_format gateway '$remote_addr "$request" $status request_id=$request_id '
                       'upstream=$upstream_status duration=$request_time';
    access_log /var/log/nginx/access.log gateway;

    # Resolver de la red Docker. Las variables de proxy_pass permiten renovar
    # la IP tras recrear un servicio y arrancar aunque un backend este caido.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        client_max_body_size 1m;
        add_header X-Request-ID $request_id always;

        location = /health {
            access_log off;
            return 200 '{"service":"API Gateway","status":"healthy"}';
        }

        location = / {
            return 200 '{"service":"API Gateway","api_prefix":"/api","routes":["/api/auth","/api/users","/api/products","/api/categories","/api/cart","/api/orders","/api/payments"]}';
        }

        # Las rutas de coordinacion entre servicios nunca se publican al cliente.
        # Nginx evalua location sobre la URI normalizada, incluidos escapes.
        location ~ ^/api/(orders|payments)/internal(/|$) {
            return 404 '{"detail":"Not Found"}';
        }

        location ~ ^/api/(auth|users)(/|$) {
            set $backend user-service:8000;
            include /etc/nginx/proxy.inc;
        }

        location ~ ^/api/(products|categories)(/|$) {
            set $backend product-service:8000;
            include /etc/nginx/proxy.inc;
        }

        location ~ ^/api/cart(/|$) {
            set $backend cart-service:8000;
            include /etc/nginx/proxy.inc;
        }

        location ~ ^/api/orders(/|$) {
            set $backend order-service:8000;
            include /etc/nginx/proxy.inc;
        }

        location ~ ^/api/payments(/|$) {
            set $backend payment-service:8000;
            include /etc/nginx/proxy.inc;
        }

        error_page 502 503 504 =503 @unavailable;
        location @unavailable {
            return 503 '{"detail":"Servicio temporalmente no disponible"}';
        }

        location / {
            return 404 '{"detail":"Not Found"}';
        }
    }
}
