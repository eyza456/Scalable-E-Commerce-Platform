apiVersion: apps/v1
kind: StatefulSet
metadata: {name: user-db}
spec:
  serviceName: user-db
  replicas: 1
  selector: {matchLabels: {app: user-db}}
  template:
    metadata: {labels: {app: user-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: ecommerce-config, key: USER_DB_NAME}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: USER_DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: USER_DB_PASSWORD}}}
          readinessProbe: {exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
