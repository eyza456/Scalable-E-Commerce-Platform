apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - {name: redis, image: redis:7-alpine, ports: [{name: redis, containerPort: 6379}], readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 5}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq}
spec:
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          readinessProbe: {exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}, initialDelaySeconds: 10, periodSeconds: 5}
