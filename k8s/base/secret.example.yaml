apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
type: Opaque
stringData:
  SECRET_KEY: replace-with-a-random-32-byte-key
  INTERNAL_SERVICE_KEY: replace-with-a-different-random-32-byte-key
  RABBITMQ_ERLANG_COOKIE: replace-with-a-random-rabbitmq-cookie
  USER_DB_USER: users
  USER_DB_PASSWORD: replace-user-db-password
  PRODUCT_DB_USER: products
  PRODUCT_DB_PASSWORD: replace-product-db-password
  ORDER_DB_USER: orders
  ORDER_DB_PASSWORD: replace-order-db-password
  PAYMENT_DB_USER: payments
  PAYMENT_DB_PASSWORD: replace-payment-db-password
  USER_DATABASE_URL: postgresql+psycopg2://users:replace-user-db-password@user-db:5432/users
  PRODUCT_DATABASE_URL: postgresql+psycopg2://products:replace-product-db-password@product-db:5432/products
  ORDER_DATABASE_URL: postgresql+psycopg2://orders:replace-order-db-password@order-db:5432/orders
  PAYMENT_DATABASE_URL: postgresql+psycopg2://payments:replace-payment-db-password@payment-db:5432/payments
