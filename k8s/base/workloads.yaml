apiVersion: apps/v1
kind: Deployment
metadata: {name: user-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: user-service}}
  template:
    metadata: {labels: {app: user-service}}
    spec:
      containers:
        - name: user-service
          image: ecommerce/user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: ecommerce-config}}, {secretRef: {name: ecommerce-secrets}}]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: USER_DATABASE_URL}}}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
---
