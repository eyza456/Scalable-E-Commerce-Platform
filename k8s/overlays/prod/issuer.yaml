apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ecommerce-letsencrypt
spec:
  acme:
    # Sustituir por el correo operativo real antes de aplicar este overlay.
    email: tls-admin@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: ecommerce-letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
