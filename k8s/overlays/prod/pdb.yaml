apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecommerce-services
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [user-service, product-service, cart-service, order-service, payment-service, notification-service, api-gateway, frontend]
