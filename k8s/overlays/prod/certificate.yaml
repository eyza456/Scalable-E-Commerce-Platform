apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ecommerce-tls
  namespace: ecommerce
spec:
  # Debe coincidir con el DNS publico que apunta al Ingress.
  secretName: ecommerce-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: ecommerce-letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - ecommerce.example.com
