apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
  - ../../base
  - ingress.yaml
patches:
  - target:
      group: ""
      version: v1
      kind: Service
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
